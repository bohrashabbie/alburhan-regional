# ---------------------------------------------------------------------------
# Proxy cache zone — 10 MB key store, 1 GB data, items expire after 1 hour.
# Served from RAM-backed tmpfs ideally; falls back to disk otherwise.
# ---------------------------------------------------------------------------
proxy_cache_path /var/cache/nginx/alburhan
    levels=1:2
    keys_zone=alburhan_cache:10m
    max_size=1g
    inactive=60m
    use_temp_path=off;

# ---------------------------------------------------------------------------
# Upstream — Next.js
# ---------------------------------------------------------------------------
upstream nextjs {
    server 127.0.0.1:3001;
    keepalive 32;           # reuse TCP connections to Node — avoids per-request handshake
}

server {
    server_name alburhan-regional.com www.alburhan-regional.com;

    client_max_body_size 50M;

    # ---- Compression -------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;          # 1–9; 5 is the sweet-spot for CPU/ratio
    gzip_min_length   1024;       # don't compress tiny responses
    gzip_buffers      16 8k;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/woff
        font/woff2;

    # ---- General proxy defaults --------------------------------------------
    # Note: ssl_session_cache, ssl_session_timeout, ssl_session_tickets,
    # ssl_protocols, ssl_prefer_server_ciphers are managed by Certbot via
    # /etc/letsencrypt/options-ssl-nginx.conf — do not duplicate them here.
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host  $host;
    proxy_read_timeout 60s;

    # ---- Static Next.js assets — serve directly from cache, 1-year TTL ----
    location /_next/static/ {
        proxy_pass         http://nextjs;
        proxy_cache        alburhan_cache;
        proxy_cache_valid  200 365d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header         X-Cache-Status $upstream_cache_status;
        add_header         Cache-Control "public, max-age=31536000, immutable";
    }

    # ---- Next.js image optimizer output — cache 7 days --------------------
    location /_next/image {
        proxy_pass        http://nextjs;
        proxy_cache       alburhan_cache;
        proxy_cache_valid 200 7d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header        X-Cache-Status $upstream_cache_status;
    }

    # ---- Public static files (favicon, logos, fonts) — cache 7 days ------
    location /public/ {
        proxy_pass        http://nextjs;
        proxy_cache       alburhan_cache;
        proxy_cache_valid 200 7d;
        proxy_cache_use_stale error timeout updating;
        add_header        X-Cache-Status $upstream_cache_status;
    }

    # ---- Frontend (Next.js pages) -----------------------------------------
    location / {
        proxy_pass http://nextjs;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;

        # Cache rendered HTML pages for 60 seconds.
        # Next.js emits Cache-Control: no-store on dynamic pages; override
        # that at the nginx layer so we can cache at the edge while Next
        # continues to use its own Data Cache internally.
        proxy_ignore_headers   Cache-Control Expires;
        proxy_cache            alburhan_cache;
        proxy_cache_valid      200 60s;
        proxy_cache_use_stale  error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock       on;
        add_header             X-Cache-Status $upstream_cache_status;
        add_header             Cache-Control "public, max-age=60, stale-while-revalidate=300";

        # Do not cache responses that set cookies (logged-in users etc.)
        proxy_no_cache         $cookie_session;
        proxy_cache_bypass     $cookie_session;
    }

    # ---- CMS Backend API (FastAPI on :8002) --------------------------------
    # Bypass proxy cache — API responses are live data.
    location /api/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_cache_bypass 1;
        proxy_no_cache     1;
    }

    # ---- Admin Panel (Angular SPA on :3000) --------------------------------
    location /admin/ {
        proxy_pass http://127.0.0.1:3000/;

        proxy_set_header Accept-Encoding "";
        proxy_redirect ~^/(.*)$ /admin/$1;
        proxy_redirect / /admin/;

        sub_filter_once off;
        sub_filter_types text/css application/javascript application/json;
        sub_filter 'href="/'   'href="/admin/';
        sub_filter 'src="/'    'src="/admin/';
        sub_filter 'action="/' 'action="/admin/';
        sub_filter 'url(/'     'url(/admin/';
    }

    # ---- Email Service (FastAPI on :8001) ----------------------------------
    location /email/ {
        proxy_pass http://127.0.0.1:8001/;

        proxy_set_header Accept-Encoding "";
        proxy_redirect ~^/(.*)$ /email/$1;
        proxy_redirect / /email/;

        sub_filter_once off;
        sub_filter_types text/css application/javascript application/json;
        sub_filter 'href="/'   'href="/email/';
        sub_filter 'src="/'    'src="/email/';
        sub_filter 'action="/' 'action="/email/';
        sub_filter 'url(/'     'url(/email/';
    }

    # ---- SSL (managed by Certbot) ------------------------------------------
    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate     /etc/letsencrypt/live/alburhan-regional.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alburhan-regional.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.alburhan-regional.com) {
        return 301 https://$host$request_uri;
    }
    if ($host = alburhan-regional.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name alburhan-regional.com www.alburhan-regional.com;
    return 404;
}
